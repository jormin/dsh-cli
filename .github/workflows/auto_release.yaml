name: Go CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: write
  pull-requests: read

jobs:

  test:
    name: Go Test and Vet
    strategy:
      matrix:
        # 交叉编译与宿主 OS 无关,统一在 ubuntu 验证发布目标(darwin/linux × amd64/arm64);当前无测试,单 OS 即可
        os: [ubuntu-latest]
        go: ["1.17.13"]
    # runs-on 使用字面量:矩阵表达式形式在本仓库一直无法分配到 runner(仅排队不执行),实测字面量可正常运行
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./...

      - name: Build check
        run: go build ./...

      - name: Cross-compile check (release targets)
        shell: bash
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build ./... || exit 1
          done

  create-release:
    name: Create Release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.17.13

      - name: Create target directory
        run: mkdir -p target

      - name: Set up tag
        id: set-up-tag
        run: |
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "Latest tag: $latest_tag"

          tag="v0.0.1"
          if [ ! -z "$latest_tag" ]; then
            latest_tag=$(echo $latest_tag | sed 's/^v//')
            IFS='.' read -r major minor patch <<< "$latest_tag"
            if ! [[ "$major" =~ ^[0-9]+$ ]] || ! [[ "$minor" =~ ^[0-9]+$ ]] || ! [[ "$patch" =~ ^[0-9]+$ ]]; then
              echo "Error: Version numbers must be integers."
              exit 1
            fi
            if (( patch < 9 )); then
              patch=$((patch + 1))
            elif (( patch == 9 && minor < 9 )); then
              patch=0
              minor=$((minor + 1))
            elif (( patch == 9 && minor == 9 )); then
              patch=0
              minor=0
              major=$((major + 1))
            else
              echo "Error: Invalid version numbers: major=$major, minor=$minor, patch=$patch"
              exit 1
            fi
            tag="v$major.$minor.$patch"
          fi
          echo "New version: $tag"
          echo "tag=$tag" >> $GITHUB_ENV
          echo "tag: $tag"

      - name: Compile Source Code
        id: compile-source-code
        run: |
          bash build.sh $tag

      - name: Get latest commit message
        id: get_commit_message
        run: |
          echo "$(git log -1 --pretty=%B)" > commit_message.txt
          cat commit_message.txt

      - name: Create tag
        shell: bash
        run: |
          git config --global user.name 'github-actions-bot'
          git config --global user.email 'github-actions-bot@users.noreply.github.com'
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists, skipping tag creation"
          else
            git tag -a $tag -F commit_message.txt
            git push origin $tag
          fi

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.tag }}
          name: ${{ env.tag }}
          body_path: commit_message.txt
          files: target/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
